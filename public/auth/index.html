<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Intelligent Image Upload System</title>
  <meta name="description" content="College Project Portal — sign in with a one-time Gmail verification code." />
  <!-- Inline favicon (data URI) so the browser stops requesting /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!--
    This is the ENTIRE integration surface: one container div, one CSS
    file, and the JS files below. To embed this in another project,
    copy the frontend/ folder, keep this div, and edit js/config.js
    (apiBaseUrl, appName, postLoginUrl / onAuthSuccess).

    The module auto-mounts here because the container carries the
    `data-otp-automount` attribute (see the bottom of js/app.js). Host
    applications leave the attribute off and call
    OtpAuthModule.mount(element, config) themselves. The mount call lives
    in an external file on purpose: Helmet's default CSP (script-src 'self')
    blocks inline <script> tags, so index.html contains none.
  -->
  <div id="otp-auth-root" class="otp-auth-root" data-otp-automount></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/otpInput.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
